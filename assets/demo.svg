<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="xpbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61dafb"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      .card { opacity: 0; animation: cardCycle 12s infinite; }
      @keyframes cardCycle {
        0% { opacity: 0; transform: translateY(26px); }
        3% { opacity: 1; transform: translateY(0); }
        21% { opacity: 1; transform: translateY(0); }
        25% { opacity: 0; transform: translateY(-18px); }
        100% { opacity: 0; transform: translateY(-18px); }
      }
      .xp-fill { animation: xpFill 12s linear infinite; }
      @keyframes xpFill { 0% { width: 40px; } 100% { width: 640px; } }
      .xp-pop { opacity: 0; animation: xpPop 12s infinite; }
      @keyframes xpPop {
        0%, 20% { opacity: 0; transform: translateY(8px) scale(0.8); }
        23% { opacity: 1; transform: translateY(0) scale(1.1); }
        27%, 45% { opacity: 1; transform: translateY(0) scale(1); }
        48%, 70% { opacity: 0; }
        73% { opacity: 1; transform: translateY(0) scale(1.1); }
        77%, 95% { opacity: 1; transform: translateY(0) scale(1); }
        98%, 100% { opacity: 0; }
      }
      .blink { animation: blink 1.1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .run-glow { animation: runGlow 3s ease-in-out infinite; }
      @keyframes runGlow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="520" rx="24" fill="url(#dbg)"/>
  <!-- browser chrome -->
  <rect x="60" y="30" width="780" height="460" rx="18" fill="#0d1526" stroke="#243252" stroke-width="2"/>
  <circle cx="100" cy="62" r="8" fill="#f87171"/><circle cx="126" cy="62" r="8" fill="#fbbf24"/><circle cx="152" cy="62" r="8" fill="#34d399"/>
  <rect x="190" y="50" width="520" height="26" rx="13" fill="#131f36"/>
  <text x="210" y="68" font-family="monospace" font-size="14" fill="#7d8aa5">react.kmnapps.xyz/lesson</text>

  <!-- CARD 1: concept -->
  <g class="card">
    <text x="110" y="150" font-size="44">📖</text>
    <text x="170" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e2e8f0">Concept — React ဆိုတာဘာလဲ</text>
    <rect x="110" y="175" width="620" height="14" rx="7" fill="#1c2942"/>
    <rect x="110" y="200" width="540" height="14" rx="7" fill="#1c2942"/>
    <rect x="110" y="225" width="580" height="14" rx="7" fill="#1c2942"/>
    <rect x="110" y="270" width="220" height="44" rx="12" fill="#123a2a"/>
    <text x="130" y="299" font-family="sans-serif" font-size="19" fill="#6ee7b7">နားလည်ပြီ, ဆက်သွားမယ် ▶</text>
  </g>

  <!-- CARD 2: code -->
  <g class="card" style="animation-delay:3s">
    <text x="110" y="150" font-size="44">💻</text>
    <text x="170" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e2e8f0">Code — ပထမဆုံး Component</text>
    <rect x="110" y="170" width="640" height="150" rx="12" fill="#080d18" stroke="#243252"/>
    <text x="130" y="205" font-family="monospace" font-size="18" fill="#c084fc">function <tspan fill="#61dafb">App</tspan>() {</text>
    <text x="130" y="235" font-family="monospace" font-size="18" fill="#c084fc">  return <tspan fill="#6ee7b7">&lt;h1&gt;</tspan><tspan fill="#e2e8f0">မင်္ဂလာပါ!</tspan><tspan fill="#6ee7b7">&lt;/h1&gt;</tspan>;</text>
    <text x="130" y="265" font-family="monospace" font-size="18" fill="#c084fc">}</text>
    <text x="560" y="305" font-family="monospace" font-size="18" fill="#61dafb" class="blink">▊</text>
    <rect class="run-glow" x="110" y="340" width="180" height="44" rx="12" fill="#0e3a4a"/>
    <text x="140" y="369" font-family="sans-serif" font-size="19" fill="#61dafb">▶ စမ်းကြည့်မယ်</text>
  </g>

  <!-- CARD 3: quiz -->
  <g class="card" style="animation-delay:6s">
    <text x="110" y="150" font-size="44">❓</text>
    <text x="170" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e2e8f0">Quiz — JSX ဆိုတာဘာလဲ?</text>
    <rect x="110" y="175" width="300" height="48" rx="12" fill="#131f36" stroke="#243252"/>
    <text x="130" y="206" font-family="sans-serif" font-size="18" fill="#94a3b8">HTML template</text>
    <rect x="110" y="235" width="300" height="48" rx="12" fill="#123a2a" stroke="#22c55e" stroke-width="2"/>
    <text x="130" y="266" font-family="sans-serif" font-size="18" fill="#6ee7b7">JS ထဲက HTML-like syntax ✓</text>
    <rect x="110" y="295" width="300" height="48" rx="12" fill="#131f36" stroke="#243252"/>
    <text x="130" y="326" font-family="sans-serif" font-size="18" fill="#94a3b8">CSS framework</text>
    <text class="xp-pop" x="470" y="270" font-family="Verdana" font-size="34" font-weight="bold" fill="#fbbf24">+20 XP 🎉</text>
  </g>

  <!-- CARD 4: playground -->
  <g class="card" style="animation-delay:9s">
    <text x="110" y="150" font-size="44">🧪</text>
    <text x="170" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e2e8f0">Playground — Counter လုပ်ကြည့်</text>
    <rect x="110" y="170" width="640" height="120" rx="12" fill="#080d18" stroke="#243252"/>
    <text x="130" y="205" font-family="monospace" font-size="18" fill="#7d8aa5">function App() {</text>
    <text x="130" y="235" font-family="monospace" font-size="18" fill="#7d8aa5">  const [n, setN] = useState(0);</text>
    <text x="130" y="265" font-family="monospace" font-size="18" fill="#61dafb">  // …ကိုယ်တိုင်ရေးကြည့် ✍️</text>
    <rect class="run-glow" x="110" y="305" width="140" height="44" rx="12" fill="#0e3a4a"/>
    <text x="140" y="334" font-family="sans-serif" font-size="19" fill="#61dafb">▶ Run</text>
    <text class="xp-pop" x="470" y="270" font-family="Verdana" font-size="34" font-weight="bold" fill="#fbbf24" style="animation-delay:9s">+30 XP 🎉</text>
  </g>

  <!-- XP bar -->
  <text x="110" y="425" font-family="sans-serif" font-size="18" fill="#7d8aa5">Level 3</text>
  <rect x="200" y="410" width="640" height="18" rx="9" fill="#131f36"/>
  <rect class="xp-fill" x="200" y="410" height="18" rx="9" fill="url(#xpbar)"/>
  <text x="110" y="465" font-family="sans-serif" font-size="16" fill="#475569">concept → code → quiz → playground — အဆင့်ဆင့်တက်မယ် 🪜</text>
</svg>
